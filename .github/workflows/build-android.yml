name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild -p android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SFX-Rider.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SFX-Rider-apk
          path: SFX-Rider.apk

      - name: Publish as "latest" release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SFX Rider (latest build)
          body: |
            Android APK for Shadowfax pickup riders. Build #${{ github.run_number }}.
            Download SFX-Rider.apk below and install (allow "Install unknown apps").
          files: SFX-Rider.apk
          make_latest: true
